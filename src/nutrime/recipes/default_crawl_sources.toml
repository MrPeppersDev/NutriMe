# -- Pinterest top food pins (discovery) ------------------------------------
# Reads Pinterest's public food pages for pins' outbound links, then fetches
# each recipe from its original site. robots.txt is checked on Pinterest and
# on every destination; if Pinterest disallows NutriMe, nothing is fetched
# from it and the run says so.
[[source]]
key = "pinterest_top"
name = "Pinterest top food pins"
kind = "pinterest"
seeds = [
  "https://www.pinterest.com/ideas/food-and-drink/918530398158/",
]
max_pages = 40
