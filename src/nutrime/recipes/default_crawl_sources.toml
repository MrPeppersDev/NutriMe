# NutriMe default crawl sources (household decision 2026-10-06).
#
# Major public recipe sites, crawled ONLY if their own robots.txt allows
# NutriMe's crawler — checked live on every run; a site that disallows us
# is skipped and reported, not crawled. Seeds that are a site root are
# expanded to the sitemaps the site's robots.txt advertises.
#
# Deliberately absent: NYT Cooking (blocks third-party bots, paywalled),
# America's Test Kitchen / Cook's Illustrated (paywalled).
#
# To change this list, copy it to <data_dir>/crawl_sources.toml and edit
# (that file then replaces this one), or set enabled = false on an entry.
# max_pages is the per-run fetch budget; runs resume where they stopped.

# -- large recipe publishers ------------------------------------------------
[[source]]
key = "allrecipes"
name = "Allrecipes"
seeds = ["https://www.allrecipes.com/"]
include = "/recipe/"
max_pages = 25

