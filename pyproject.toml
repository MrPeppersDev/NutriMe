[project]
name = "nutrime"
version = "0.0.1"
description = "Local-first personal nutrition and meal-planning system. Multi-tenant home server + iPhone client."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Mr. Peppers" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Private :: Do Not Upload",
]
dependencies = [
    "sqlite-vec>=0.1.9",
]

[project.scripts]
nutrime = "nutrime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]
e2e = [
    "playwright==1.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrime"]

[tool.pytest.ini_options]
markers = [
    "e2e: real-browser tests (need `uv sync --group e2e` + `playwright install chromium`)",
]
